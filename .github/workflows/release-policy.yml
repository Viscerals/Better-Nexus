name: Release policy

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  candidate:
    name: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      candidate_sha: ${{ steps.resolve.outputs.candidate_sha }}
    steps:
      - name: Resolve immutable candidate
        id: resolve
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $candidate = if ($env:EVENT_NAME -eq 'pull_request') { $env:PR_HEAD_SHA } else { $env:EVENT_SHA }
          if ($candidate -notmatch '^[0-9a-f]{40}$') { throw "Unable to resolve immutable candidate for $env:EVENT_NAME." }
          "candidate_sha=$candidate" >> $env:GITHUB_OUTPUT

  release-policy:
    name: release-policy
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the reviewed tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.candidate.outputs.candidate_sha }}
          persist-credentials: false

      - name: Verify exact candidate checkout
        shell: pwsh
        env:
          EXPECTED_CANDIDATE_SHA: ${{ needs.candidate.outputs.candidate_sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -cne $env:EXPECTED_CANDIDATE_SHA) { throw "Expected $env:EXPECTED_CANDIDATE_SHA, checked out $actual." }
          "Exact candidate HEAD: $actual" >> $env:GITHUB_STEP_SUMMARY

      - name: Verify license and release policy
        shell: pwsh
        run: ./tools/Test-ReleasePolicy.ps1

  lua-regression:
    name: lua-regression
    needs: candidate
    runs-on: ubuntu-latest
    # Prior Linux fixtures: 327s; preceding 207 inventory tests: 141s.
    # Allow one nonduplicated pass, setup, and the remaining tests.
    timeout-minutes: 15
    steps:
      - name: Check out the reviewed tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.candidate.outputs.candidate_sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact candidate checkout
        shell: pwsh
        env:
          EXPECTED_CANDIDATE_SHA: ${{ needs.candidate.outputs.candidate_sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -cne $env:EXPECTED_CANDIDATE_SHA) { throw "Expected $env:EXPECTED_CANDIDATE_SHA, checked out $actual." }
          "Exact candidate HEAD: $actual" >> $env:GITHUB_STEP_SUMMARY

      - name: Verify exact compatibility source
        shell: bash
        run: |
          historical=6f6204dc9e94b0339f2c9cbacf0c5de8b98a539f
          expected_tree=0d293768d6c7a14d78a9b9ee9b3844d2b9bad3b6
          test "$(git log -1 --format=%H "$historical")" = "$historical"
          actual_tree=$(git log -1 --format=%T "$historical")
          test "$actual_tree" = "$expected_tree"
          echo "Compatibility source: $historical tree $actual_tree" >> "$GITHUB_STEP_SUMMARY"

      - name: Install LuaJIT
        run: |
          sudo apt-get update
          sudo apt-get install --yes luajit

      - name: Select Node.js for inventory accounting
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.13.1"

      - name: Run normal Lua regression programs
        shell: bash
        run: |
          uname -sr
          luajit -v
          node tools/Run-LuaSuite.js --runtime luajit --timeout-seconds 600

      - name: Check bounded Lua diagnostic contents
        id: diagnostics
        if: failure() || cancelled()
        shell: pwsh
        run: |
          . ./tools/ArtifactPathPolicy.ps1
          $root = (Get-Location).Path
          $files = @(Get-ChildItem -Path build/lua-suite/manifest.json,build/lua-suite/*.log -File -ErrorAction SilentlyContinue)
          if (@($files | Where-Object { $_.Length -gt 1048576 -or $_.LinkType }).Count) { throw 'Diagnostic file exceeds existing content-check coverage or is a link; upload withheld.' }
          $paths = @($files | ForEach-Object { [IO.Path]::GetRelativePath($root, $_.FullName).Replace('\', '/') })
          $findings = @(Test-ArtifactPathSet -RepositoryRoot $root -Candidates $paths -ReadContent)
          # Exact path exception only. Synthetic tests prove private-content: findings
          # remain blocking for user paths, credential literals, and private keys.
          $unexpected = @($findings | Where-Object { $_ -notin @($paths | ForEach-Object { "path:$_" }) })
          if ($unexpected.Count) { throw "Diagnostic content check refused: $($unexpected -join ', ')" }
          "Diagnostic content checks passed for $($files.Count) enumerated files; retention 5 days."
          $paths | ForEach-Object { "Diagnostic file: $_" }

      # Explicit PR #70 diagnostic authority: failure/cancellation only, five days.
      # A hard runner termination can prevent upload. Missing evidence is not PASS.
      - name: Upload failed or interrupted Lua diagnostics
        if: (failure() || cancelled()) && steps.diagnostics.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: luajit-inventory-diagnostics
          path: |
            build/lua-suite/manifest.json
            build/lua-suite/*.log
          retention-days: 5
          if-no-files-found: ignore

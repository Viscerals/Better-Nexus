name: Publish Nexus documentation website
on:
  push:
    branches: ["docs/site-preview-20261006"]
    paths:
      - 'website-preview/**'
      - '.github/workflows/pages-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nexus-pages-preview
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build and validate original website
        run: |
          python -m pip install -r website-preview/requirements.lock.txt
          python -m mkdocs build --strict --config-file website-preview/mkdocs.yml
          python website-preview/tools/check_site.py
      - name: Stage canonical website and preview compatibility
        run: python website-preview/tools/stage_site.py --output pages-artifact
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: pages-artifact
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish documentation website
        id: publish
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
